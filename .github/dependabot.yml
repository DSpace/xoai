#-------------------
# DSpace's dependabot rules. 
# Enables maven updates for all dependencies on a weekly basis for primary branch.
#-------------------
version: 2
updates:
  ###############
  ## Primary (3.x) branch
  ###############
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "02:00"
    # Allow updates to be delayed for a configurable number of days to mitigate
    # some classes of supply chain attacks
    cooldown:
      default-days: 7
    # Allow up to 10 open PRs for dependencies
    open-pull-requests-limit: 10
    # Group together some upgrades in a single PR
    groups:
      # Group together all Build Tools in a single PR
      build-tools:
        applies-to: version-updates
        patterns:
        - "org.apache.maven.plugins:*"
        - "*:*-maven-plugin"
        - "*:maven-*-plugin"
        - "org.sonatype.*:*"
        update-types:
        - "minor"
        - "patch"
      test-tools:
        applies-to: version-updates
        patterns:
        - "junit:*"
        - "org.hamcrest:*"
        - "org.mockito:*"
        - "org.dom4j:*"
        update-types:
        - "minor"
        - "patch"
      # Group together all Apache Commons deps in a single PR
      apache-commons:
        applies-to: version-updates
        patterns:
        - "org.apache.commons:*"
        - "commons-*:commons-*"
        update-types:
        - "minor"
        - "patch"
    ignore:
      # Don't try to auto-update any DSpace dependencies
      - dependency-name: "org.dspace:*"
      - dependency-name: "org.dspace.*:*"
      # Ignore all major version updates for all dependencies. We'll only automate minor/patch updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Also automatically update all our GitHub actions on the primary branch
  - package-ecosystem: "github-actions"
    directory: "/"
    # Monthly dependency updates
    schedule:
      interval: "monthly"
      time: "02:00"
    # Allow updates to be delayed for a configurable number of days to mitigate
    # some classes of supply chain attacks
    cooldown:
      default-days: 7
    groups:
      # Group together all GitHub official actions into a single PR
      github-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
          - "github/*"
    ignore:
      # For official GitHub actions, ignore minor & patch releases because we reference these actions
      # via a major version tag which automatically uses the latest minor/patch version (e.g. "actions/checkout@v6")
      - dependency-name: "actions/*"
        update-types: [ "version-update:semver-minor", "version-update:semver-patch" ]
      - dependency-name: "github/*"
        update-types: [ "version-update:semver-minor", "version-update:semver-patch" ]
